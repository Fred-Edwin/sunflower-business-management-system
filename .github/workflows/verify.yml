name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sunflower
          POSTGRES_PASSWORD: sunflower
          POSTGRES_DB: sunflower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunflower"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sunflower:sunflower@localhost:5432/sunflower
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-any-real-environment
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma migrate deploy

      - run: pnpm verify
