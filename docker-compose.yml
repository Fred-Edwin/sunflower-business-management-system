services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sunflower
      POSTGRES_PASSWORD: sunflower
      POSTGRES_DB: sunflower
    ports:
      - "5432:5432"
    volumes:
      - sunflower_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunflower"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  sunflower_pgdata:
